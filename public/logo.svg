<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 60" fill="none" aria-hidden="true">
  <title>ID Photo Maker India</title>
  <defs>
    <linearGradient id="icon-bg" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <clipPath id="icon-clip">
      <rect x="4" y="4" width="52" height="52" rx="12"/>
    </clipPath>
  </defs>

  <!-- Icon background -->
  <rect x="4" y="4" width="52" height="52" rx="12" fill="url(#icon-bg)"/>

  <!-- Card shadow -->
  <rect x="9" y="13" width="42" height="31" rx="3" fill="#1D4ED8" opacity="0.4"/>

  <!-- White card -->
  <rect x="8" y="12" width="42" height="31" rx="3" fill="white"/>

  <!-- Tricolor stripe -->
  <rect x="8" y="12" width="42" height="1.4" clip-path="url(#icon-clip)" fill="#FF9933"/>
  <rect x="8" y="13.4" width="42" height="1.4" clip-path="url(#icon-clip)" fill="white"/>
  <rect x="8" y="14.8" width="42" height="1.4" clip-path="url(#icon-clip)" fill="#138808"/>

  <!-- Photo box -->
  <rect x="11" y="17" width="12" height="15" rx="1.5" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.5"/>
  <!-- Person head -->
  <circle cx="17" cy="21" r="3.2" fill="#3B82F6" opacity="0.55"/>
  <!-- Shoulders -->
  <path d="M11 32 Q11 27 17 27 Q23 27 23 32 Z" fill="#3B82F6" opacity="0.5"/>

  <!-- Text lines -->
  <rect x="26" y="18" width="20" height="2.5" rx="1" fill="#1E3A8A"/>
  <rect x="26" y="23" width="17" height="2" rx="1" fill="#93C5FD"/>
  <rect x="26" y="27" width="19" height="2" rx="1" fill="#BFDBFE"/>
  <rect x="26" y="31" width="15" height="2" rx="1" fill="#DBEAFE"/>

  <!-- Divider -->
  <rect x="11" y="34" width="36" height="0.5" rx="0.5" fill="#E2E8F0"/>

  <!-- Barcode mini -->
  <rect x="11" y="36" width="2"   height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="14" y="36" width="1.2" height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="16.5" y="36" width="1.8" height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="19.5" y="36" width="1"  height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="21.5" y="36" width="2.5" height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="25"   y="36" width="1.5" height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="27.5" y="36" width="2"  height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="30.5" y="36" width="1"  height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="32.5" y="36" width="2.5" height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="36.5" y="36" width="1.2" height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="39"   y="36" width="1.8" height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="42"   y="36" width="1"  height="3" rx="0.4" fill="#CBD5E1"/>
  <rect x="44"   y="36" width="2"  height="3" rx="0.4" fill="#CBD5E1"/>

  <!-- Camera badge -->
  <circle cx="52" cy="50" r="6" fill="#1E40AF"/>
  <circle cx="52" cy="50" r="5" fill="#2563EB"/>
  <rect x="48.5" y="47.5" width="7" height="5" rx="1" fill="white" opacity="0.9"/>
  <circle cx="52" cy="50" r="1.8" fill="#1D4ED8"/>
  <circle cx="52.8" cy="49.2" r="0.6" fill="white" opacity="0.7"/>
  <rect x="50.5" y="46.5" width="3" height="1.5" rx="0.6" fill="white" opacity="0.9"/>

  <!-- Wordmark -->
  <text
    x="72"
    y="38"
    fill="#111827"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="-0.025em"
  >ID Photo Maker India</text>
</svg>
